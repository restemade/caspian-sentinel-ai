server {
  listen 80;
  server_name _;
  index index.html;
  client_max_body_size 12m;

  location = /health { access_log off; return 200 "ok\n"; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://api:8000; }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
